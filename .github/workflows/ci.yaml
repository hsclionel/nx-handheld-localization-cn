---
name: CI

# yamllint disable-line rule:truthy
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    # Host-only: no toolchain image, no firmware build (see scripts/tests/run-host-tests.sh).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0

      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zlib1g-dev libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev unzip zip rsync

      - name: Host tests
        run: bash scripts/tests/run-host-tests.sh
